name: Automated Nostr Signing & Timechain Anchoring

on:
  push:
    branches:
      - main
    paths:
      - 'paper/wu_accounting_framework.tex' # Compiles when document edits occur
  schedule:
    - cron: '0 */3 * * *' # Checks Bitcoin calendars automatically every 3 hours for confirmation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_anchor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- 1. SETUP BUILD PIPELINE ----
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Crypto Dependencies
        run: |
          npm init -y
          npm install opentimestamps nostr-tools

      # ---- 2. OPTIONAL COMPILATION STEP (e.g. your LaTeX code) ----
      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        continue-on-error: true # Ensure execution script runs even if tex configuration shifts
        with:
          root_file: wu_accounting_framework.tex
          working_directory: paper
          latexmk_use_xelatex: false

      # ---- 3. RUN NOSTR AND OPEN-TIMESTAMPS ENGINE ----
      # This looks for paper/wu_accounting_framework.pdf, generates JSON/OTS if empty, 
      # or automatically upgrades it if the file already exists.
      - name: Process Signature & Timechain Anchoring
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
        run: |
          node .github/scripts/sign-and-timestamp.js paper/wu_accounting_framework.pdf

      # ---- 4. COMMIT RESULTS PERMANENTLY ----
      - name: Push signed data and time logs back to code repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add paper/*.pdf paper/*.json paper/*.ots || true
          git diff --staged --quiet || git commit -m "chore: update timechain anchor logs [skip ci]"
          git push origin main
