name: Automated Nostr Signing & Timechain Anchoring

on:
  push:
    branches:
      - main
    paths:
      - 'paper/wu_accounting_framework.tex'
      - '.github/workflows/build-paper.yml'
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_anchor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Crypto Dependencies
        run: |
          npm init -y
          npm pkg set type="module"
          npm install opentimestamps nostr-tools

      # ---- CRITICAL CHECKSTEP: PIPELINE AUDIT VERIFICATION ----
      # We allow this step to continue on error because a missing file or failed audit
      # safely indicates that a new PDF compilation cycle is required.
      - name: Run Sovereign Audit Pre-flight Check
        id: audit_check
        continue-on-error: true
        run: |
          if node .github/scripts/sign-and-timestamp.js paper/wu_accounting_framework.pdf --check-only; then
            echo "NEED_BUILD=false" >> $GITHUB_ENV
            echo "🎉 Pipeline is mathematically locked and valid. Skipping rebuild."
          else
            echo "NEED_BUILD=true" >> $GITHUB_ENV
            echo "⚠️ Verification failed or files missing. Initializing compilation stack."
          fi

      # ---- LATEX COMPILATION (RUNS ONLY IF AUDIT FAILS / TEX MODIFIED) ----
      - name: Compile LaTeX to PDF
        if: env.NEED_BUILD == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: wu_accounting_framework.tex
          working_directory: paper
          latexmk_use_xelatex: false

      # ---- FORGE ENVELOPE STRUCTS AND RUN LOG TIMESTAMP ENGINE ----
      - name: Process Signature & Timechain Anchoring
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
        run: |
          node .github/scripts/sign-and-timestamp.js paper/wu_accounting_framework.pdf

      # ---- SECURE WRITEDOWN BACK INTO CODEBASE ----
      - name: Push signed data and time logs back to code repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add paper/*.pdf paper/*.json paper/*.ots || true
          git diff --staged --quiet || git commit -m "chore: optimize cryptographic time logs [skip ci]"
          git push origin main
